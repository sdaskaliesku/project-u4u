<div class="faq-lang-selector">
  <button [class.active]="lang === 'en'" (click)="setLang('en')">English</button>
  <button [class.active]="lang === 'uk'" (click)="setLang('uk')">Українська</button>
</div>

<h2>{{ t('faqTitle') }}</h2>
<div class="faq-controls">
  <button (click)="expandAll()">{{t("expand")}}</button>
  <button (click)="collapseAll()">{{t("collapse")}}</button>
</div>

<div class="faq-list">
  <div *ngFor="let item of faqItems; let i = index" class="faq-item">
    <button class="faq-question" (click)="toggle(i)">
      <span class="arrow" [class.expanded]="expanded[i]">&#9656;</span>
      {{ t(item.q) }}
    </button>
    <div class="faq-answer" *ngIf="expanded[i]">
      {{ t(item.a) }}
    </div>
  </div>
</div>
